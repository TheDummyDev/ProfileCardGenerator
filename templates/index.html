<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Create Your Profile Card</h1>
            <form action="/" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="{{ name or '' }}" required>

                <label for="user_id">User ID:</label>
                <input type="text" id="user_id" name="user_id" value="{{ user_id or '' }}" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>

                <button type="submit">Generate Card</button>
            </form>
        </div>

        <div class="card-container">
            {% if name %}
            <div class="profile-card">
                <div class="card-header">
                    <img src="https://via.placeholder.com/100" alt="Avatar" class="avatar">
                </div>
                <div class="card-body">
                    <h2>{{ name }}</h2>
                    <p>ID: {{ user_id }}</p>
                    <p>{{ email }}</p>
                </div>
            </div>
            {% else %}
            <div class="profile-card placeholder-card">
                <p>Your profile card will appear here</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
